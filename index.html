r","f":"health + -y + -er","m":"আরও স্বাস্থ্যকর","n":"healthy → healthier (y → ier)। better, happier-এর সাথে একই তুলনামূলক রূপ।"},{"p":19,"t":"Kindness","s":"___ is a divine virtue.","b":"দয়া একটি স্বর্গীয় গুণ।","w":"Kindness","f":"kind + -ness","m":"দয়া","n":"kind (দয়ালু) + -ness = kindness (দয়া)। বাক্যের কর্তা, তাই বিশেষ্য।"},{"p":19,"t":"Kindness","s":"So we should not be unkind to people in distress and even to ___ animals.","b":"তাই বিপন্ন মানুষের প্রতি এবং এমনকি ছোট প্রাণীদের প্রতিও আমাদের নিষ্ঠুর হওয়া উচিত নয়।","w":"lower","f":"low + -er","m":"নিম্নতর / ছোট","n":"-er তুলনামূলক: low → lower (নিম্নতর)। lower animals = নিম্ন শ্রেণির প্রাণী।"},{"p":19,"t":"Kindness","s":"This is an ___ behaviour.","b":"এটি একটি অযৌক্তিক আচরণ।","w":"irrational","f":"ir- + rational","m":"অযৌক্তিক","n":"ir- = না। r-এর আগে ir- হয়: rational → irrational (অযৌক্তিক)।"},{"p":19,"t":"Kindness","s":"They are ___ beings.","b":"তারা নিরীহ প্রাণী।","w":"harmless","f":"harm + -less","m":"নিরীহ / ক্ষতিহীন","n":"-less = ছাড়া। harm → harmless (নিরীহ)। harmful-এর বিপরীত।"},{"p":19,"t":"Kindness","s":"If we are kind to them, they will have no ___ in risking their lives for our protection.","b":"আমরা যদি তাদের প্রতি দয়ালু হই, তবে তারা আমাদের সুরক্ষায় তাদের জীবন বাজি রাখতে কোনো দ্বিধা করবে না।","w":"hesitation","f":"hesitate + -ion","m":"দ্বিধা","n":"hesitate (দ্বিধা করা) → hesitation (দ্বিধা)। 'no ___' এর পর বিশেষ্য।"},{"p":26,"t":"Load-shedding","s":"Load-shedding is not ___.","b":"লোডশেডিং কোনো বাঞ্ছনীয় বিষয় নয়।","w":"desirable","f":"desire + -able","m":"বাঞ্ছনীয় / কাম্য","n":"e বাদ + -able: desire → desirable (কাম্য)। 'is not ___' এ বিশেষণ।"},{"p":26,"t":"Load-shedding","s":"It makes our life ___ and boring.","b":"এটি আমাদের জীবনকে অসহনীয় ও বিরক্তিকর করে তোলে।","w":"intolerable","f":"in- + tolerate + -able","m":"অসহনীয়","n":"tolerable (সহনীয়) → in- = না → intolerable (অসহনীয়)।"},{"p":26,"t":"Load-shedding","s":"Our country is densely ___.","b":"আমাদের দেশ ঘনবসতিপূর্ণ।","w":"pop sersby.","b":"জানা গেছে যে, অদক্ষ চালকদের ট্রাফিক আইন লঙ্ঘন এবং অসচেতন পথচারীদের কারণে বেশিরভাগ দুর্ঘটনা ঘটে থাকে।","w":"unconscious","f":"un- + conscious","m":"অসচেতন","n":"conscious (সচেতন) → un- = না → unconscious (অসচেতন)।"},{"p":35,"t":"Road Accidents","s":"Many unlicensed and ___ vehicles run on the streets.","b":"লাইসেন্সবিহীন ও ত্রুটিপূর্ণ অনেক যানবাহন রাস্তায় চলাচল করে।","w":"faulty","f":"fault + -y","m":"ত্রুটিপূর্ণ","n":"fault (ত্রুটি) + -y = faulty (ত্রুটিপূর্ণ)।"},{"p":35,"t":"Road Accidents","s":"These vehicles endanger the ___ of passengers and the passersby.","b":"এই যানবাহনগুলো যাত্রী এবং পথচারীদের নিরাপত্তাকে বিপন্ন করে তোলে।","w":"safety","f":"safe + -ty","m":"নিরাপত্তা","n":"বিশেষণ safe → বিশেষ্য safety (নিরাপত্তা)। 'the ___ of' এ বিশেষ্য।"},{"p":36,"t":"Value of Education","s":"Education is essential for any kind of ___.","b":"যেকোনো ধরনের উন্নয়নের জন্য শিক্ষা অপরিহার্য।","w":"development","f":"develop + -ment","m":"উন্নয়ন","n":"-ment ক্রিয়াকে বিশেষ্য বানায়: develop → development (উন্নয়ন)।"},{"p":36,"t":"Value of Education","s":"The poor socio-economic condition of our country can be largely attributed to many people's ___ to education.","b":"আমাদের দেশের দরিদ্র আর্থ-সামাজিক অবস্থার জন্য বহু মানুষের শিক্ষা লাভের সুযোগের অভাবকে বহুলাংশে দায়ী করা যায়।","w":"inaccessibility","f":"in- + access + -ible + -ity","m":"অপ্রাপ্যতা / সুযোগের অভাব","n":"accessible (প্রবেশযোগ্য) → in- = না → inaccessible → -ity যোগে বিশেষ্য: inaccessibility।"},{"p":36,"t":"Value of Education","s":"Many illiterate people do not have any knowledge of health, sanitation and ___ control.","b":"অনেক নিরক্ষর মানুষের স্বাস্থ্য, স্যানিটেশন এবং জনসংখ্যা নিয়ন্ত্রণ সম্পর্কে কোনো জ্ঞান নেই।","w":"population","f":"populate + -ion","m":"জনসংখ্যা","n":"populate → population (জনসংখ্যা)। population control = জোড়া বিশেষ্য।"},{"p":36,"t":"Value of Education","s":"It enables us to perform our duties ___.","b":"এটি আমাদের দায়িত্বগুলো সঠিকভাবে পালন করতে সক্ষম করে তোলে।","w":"properly","f":"proper + -ly","m":"সঠিকভাবে","n":"proper (সঠিক) + -ly = ক্রিয়াবিশেষণ। perform ক্রিয়াকে বর্ণনা করছে।"},{"p":36,"t":"Value of Education","s":"It provides us with an ___ awareness about things, and this awareness is a prerequisite for social development.","b":"এটি আমাদের চারপাশের বিষয়গুলো সম্পর্কে একটি আলোকিত সচেতনতা প্রদান করে এবং এই সচেতনতা সামাজিক উন্নয়নের পূর্বশর্ত।","w":"enlightened","f":"en- + light + -en + -ed","m":"আলোকিত","n":"light → enlighten (আলোকিত করা) → enlightened (আলোকিত)। awareness-এর আগে বিশেষণ।"},{"p":37,"t":"Importance of Books","s":"They introduce us to the realm of ___ knowledge.","b":"তারা আমাদের অসীম জ্ঞানের রাজ্যের সাথে পরিচয় করিয়ে দেয়।","w":"unlimited","f":"un- + limit + -ed","m":"অসীম","n":"limited (সীমিত) → un- = না → unlimited (অসীম)।"},{"p":37,"t":"Importance of Books","s":"We can ___ our mind by reading books.","b":"বই পড়ার মাধ্যমে আমরা আমাদের মনকে সমৃদ্ধ করতে পারি।","w":"enrich","f":"en- + rich","m":"সমৃদ্ধ করা","n":"en- বিশেষণ rich (ধনী)-কে ক্রিয়া বানায়: enrich = সমৃদ্ধ করা।"},{"p":37,"t":"Importance of Books","s":"No spiritual progress and worldly ___ can be imagined without reading books.","b":"বই পড়া ছাড়া কোনো আধ্যাত্মিক উন্নতি এবং পার্থিব সমৃদ্ধি কল্পনা করা যায় না।","w":"prosperity","f":"prosper + -ity","m":"উন্নতি / সমৃদ্ধি","n":"prosper (সমৃদ্ধ হওয়া) → prosperity (সমৃদ্ধি)। 'worldly ___' এ বিশেষ্য।"},{"p":37,"t":"Importance of Books","s":"___ speaking, reading books is such a thing which has no alternative.","b":"সত্যি বলতে, বই পড়ার মতো এমন একটি বিষয় যার কোনো বিকল্প নেই।","w":"Truly","f":"true + -ly","m":"সত্যি বলতে","n":"e বাদ + -ly: true → truly (সত্যি বলতে)।"},{"p":37,"t":"Importance of Books","s":"So, we should read books on ___ topics so that we may bring about proper development of our spirit.","b":"তাই আমাদের বিভিন্ন বিষয়ের ওপর বই পড়া উচিত যাতে আমরা আমাদের আত্মার সঠিক বিকাশ ঘটাতে পারি।","w":"various","f":"vary + -ous","m":"বিভিন্ন","n":"vary (বদলানো) → various (বিভিন্ন)। y বদলে i হয়েছে। বহুবচন noun-এর আগে বিশেষণ।"}];
const PRE=['un-','in-','im-','ir-','dis-','mis-','over-','en-','re-'],
SUF=['-ful','-less','-ness','-ous','-ic','-ism','-dom','-ment','-ion','-ity','-ure','-ly','-er','-y','-al','-ward','-ship','-ty','-ed','-able','-ent','-ence','-ize','-ative'];
const isA=x=>/^-|-$/.test(x);
const $=q=>document.querySelector(q),stage=$('#stage'),sh=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const fh=f=>f.split(' + ').map(t=>`<span class="${t.endsWith('-')?'p':t.startsWith('-')?'s':'r'}">${t}</span>`).join(' + ');
const kind=f=>{const t=f.split(' + '),p=t.some(x=>x.endsWith('-')),s=t.some(x=>x.startsWith('-'));return p&&s?'Both':p?'Prefix':s?'Suffix':'Neither'};
const cap=(w,s)=>{w=w.toLowerCase();return /^___/.test(s)?w[0].toUpperCase()+w.slice(1):w};
const RANKS=['Beginner','Word Scout','Affix Hunter','Root Master','Grammar Hero'];
let xp=0,mode='gap',tp='all',S={};try{xp=+localStorage.getItem('quest-xp')||0}catch(e){}
function addXP(n){xp+=n;try{localStorage.setItem('quest-xp',xp)}catch(e){}}
function hud(){const l=Math.floor(xp/100)+1;$('#xp').textContent=xp;$('#lv').textContent=l;$('#st').textContent=mode==='pass'?PF:(S.streak||0);$('#rk').textContent=RANKS[Math.min(l-1,4)];$('#xb').style.width=(xp%100)+'%'}
const pool=()=>tp==='all'?I:I.filter(x=>x.p==tp);
const seen={};$('#tp').innerHTML='<option value="all">All topics · সব অনুচ্ছেদ</option>'+I.filter(x=>!seen[x.p]&&(seen[x.p]=1)).map(x=>`<option value="${x.p}">${String(x.p).padStart(2,'0')} ${x.t}</option>`).join('');

function start(){
  clearInterval(S.iv);S={streak:0,ok:0,i:0,n:0,miss:[],gain:0,done:false};
  if(mode==='pass'){passStart();hud();return}
  if(mode==='tag'){S.t=60;tagQ();S.iv=setInterval(()=>{S.t--;const e=$('#tm');if(e)e.textContent=S.t;if(S.t<=0)end()},1000)}
  else{const base=mode==='build'?pool().filter(x=>x.f.split(' + ').some(isA)):pool();S.q=sh(base).slice(0,10);show()}
  hud()}
function show(){
  if(S.i>=S.q.length)return end();
  const d=S.q[S.i],N=S.q.length;let opts,ans,clue='';
  if(mode==='gap'){
    const others=[...new Set(I.filter(x=>x.p===d.p&&x.w.toLowerCase()!==d.w.toLowerCase()).map(x=>x.w.toLowerCase()))];
    opts=sh([d.w.toLowerCase(),...sh(others).slice(0,3)]).map(x=>cap(x,d.s));ans=cap(d.w,d.s);
  }else{
    const set=new Set([d.f]);let n=0;
    while(set.size<4&&n++<60){const t=d.f.split(' + '),ix=t.map((x,i)=>isA(x)?i:-1).filter(i=>i>=0),i=ix[Math.random()*ix.length|0],pl=t[i].endsWith('-')?PRE:SUF;t[i]=pl[Math.random()*pl.length|0];set.add(t.join(' + '))}
    while(set.size<4)set.add(I[Math.random()*I.length|0].f);
    opts=sh([...set]);ans=d.f;
    clue=`<p class="clue">Clue word: <b>${d.f.split(' + ').filter(x=>!isA(x)).join(' + ')}</b> <span class="bn">&nbsp;(${d.m})</span></p>`;
  }
  S.opts=opts;S.ans=ans;S.done=false;
  stage.innerHTML=`<div class="prog"><i style="width:${S.i/N*100}%"></i></div><p class="cnt">Question ${S.i+1} of ${N}<span class="tag">${String(d.p).padStart(2,'0')} ${d.t}</span></p>
  <p class="how">${mode==='gap'?'Choose the word that fits the gap.':'Choose the correct word formula for the gap.'}</p>
  <p class="sent">${d.s.replace('___','<span class="gap">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>')}</p>
  <div class="bnbox bn"><small>বাংলা অনুবাদ</small>${d.b}</div>${clue}
  <div class="opts${mode==='gap'?' two':''}">${opts.map((o,i)=>`<button data-a="pick" data-i="${i}">${mode==='build'?fh(o):o}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
}
function pick(i){
  if(S.done)return;S.done=true;const d=S.q[S.i],ok=S.opts[i]===S.ans,bs=document.querySelectorAll('.opts button');
  bs.forEach((b,j)=>{b.disabled=true;if(S.opts[j]===S.ans)b.classList.add('ok')});
  let g=0;if(ok){S.ok++;S.streak++;g=10+Math.min(S.streak-1,5)*2;S.gain+=g;addXP(g)}else{bs[i].classList.add('no');S.streak=0;S.miss.push(d)}
  const w=cap(d.w,d.s);
  $('#fb').innerHTML=`<b>${ok?'Correct! +'+g+' XP':'Not quite.'}</b><div class="sent" style="font-size:19px">${d.s.replace('___','<b class="hl">'+w+'</b>')}</div>
  <div>${fh(d.f)} = <b>${w}</b> &nbsp;<span class="chip">${kind(d.f)}</span></div><div class="ex bn">${d.n}</div>
  <button class="next" data-a="next">${S.i>=S.q.length-1?'Finish':'Next'}</button>`;hud()}

function tagQ(){
  const d=pool()[Math.random()*pool().length|0];S.cur=d;
  stage.innerHTML=`<p class="how">Does the word have a prefix, a suffix, both, or neither? A wrong answer costs 3 seconds.</p><p class="cnt">Time left: <b id="tm">${S.t}</b> s &nbsp; Correct: ${S.ok}</p>
  <div class="eq r">${d.w.toLowerCase()}</div><p class="mean bn">${d.m}</p>
  <div class="opts two">${['Prefix','Suffix','Both','Neither'].map(k=>`<button data-a="tag" data-k="${k}">${k}</button>`).join('')}</div><div class="fb">${S.last||''}</div>`}
function tagPick(k){
  const d=S.cur,kd=kind(d.f),ok=k===kd;S.n++;
  if(ok){S.ok++;S.streak++;const g=4+Math.min(S.streak-1,5);S.gain+=g;addXP(g)}else{S.streak=0;S.t-=3;S.miss.push(d)}
  S.last=`${ok?'Correct!':'Oops.'} <b>${d.w.toLowerCase()}</b> = ${fh(d.f)} (${kd})`;hud();
  if(S.t<=0)return end();tagQ()}

function end(){
  clearInterval(S.iv);hud();
  const tot=mode==='tag'?S.n:S.q.length,pct=tot?Math.round(S.ok/tot*100):0,
  msg=pct>=90?'Superb! You are an affix master.':pct>=60?'Good job. Keep practising.':'Keep going. Review the words below and try again.';
  const miss=[...new Map(S.miss.map(d=>[d.w.toLowerCase(),d])).values()];

 soldiers killed our people mercilessly. They continued atrocities in [d] with the local collaborators. [e], they were defeated in the end.","bn":"আমাদের জাতীয় স্মৃতিসৌধ মুক্তিযুদ্ধের শহীদদের প্রতি জাতির শ্রদ্ধার প্রতীক। এটি এমন এক অর্জন যা পরিমাপাতীত। পাকিস্তানের সুসজ্জিত সৈন্যদের বিরুদ্ধে যুদ্ধে আমাদের মুক্তিযোদ্ধারা তাদের অনন্য বীরত্ব দেখিয়েছিলেন। পাকিস্তানি সৈন্যরা আমাদের মানুষকে নির্মমভাবে হত্যা করেছিল। তারা স্থানীয় দোসরদের সহযোগিতায় অত্যাচার চালিয়ে গিয়েছিল। যাইহোক, শেষ পর্যন্ত তারা পরাজিত হয়েছিল।","ans":["liberation","immeasurable","heroism","association","However"]},{"no":12,"t":"Smart Bangladesh","board":"CtgB 2025","en":"Smart Bangladesh is a new term. It refers to the vision of [a] Bangladesh a technologically advanced and digitally empowered nation. The [b] has changed the name of Digital Bangladesh to Smart Bangladesh. Smart Bangladesh means making smart citizens, society, economy and smart government. Activities in [c], health, agriculture and the financial sector will be transformed into smart systems. In Smart Bangladesh, everything will be done technologically, and the urban [d] will also be directed by computer and the internet. A smart village will be a rural community where local citizens can connect with the global market through the use of digital technology and open innovative platforms. Smart Bangladesh is not just a vision but a reality that is [e] taking shape and marching ahead.","bn":"স্মার্ট বাংলাদেশ একটি নতুন শব্দ (ধারণা)। এটি বাংলাদেশকে প্রযুক্তিগতভাবে উন্নত এবং ডিজিটালভাবে ক্ষমতাবান জাতি হিসেবে গড়ে তোলার রূপকল্পকে বোঝায়। সরকার ডিজিটাল বাংলাদেশের নাম পরিবর্তন করে স্মার্ট বাংলাদেশ করেছে। স্মার্ট বাংলাদেশ মানে স্মার্ট নাগরিক, সমাজ, অর্থনীতি এবং স্মার্ট সরকার গঠন করা। শিক্ষা, স্বাস্থ্য, কৃষি ও আর্থিক খাতের কার্যক্রম স্মার্ট সিস্টেমে রূপান্তরিত হবে। স্মার্ট বাংলাদেশে সবকিছু প্রযুক্তিগতভাবে সম্পন্ন হবে এবং শহরের প্রশাসনও কম্পিউটার ও ইন্টারনেটের মাধ্যমে পরিচালিত হবে। একটি স্মার্ট ভিলেজ হবে এমন একটি গ্রামীণ সম্প্রদায় যেখানে স্থানীয় ld be extended for a better, happier, [e] life and a peaceful environment.","bn":"গাছ মানুষের জন্য নানাভাবে উপকারী। তারা আমাদের দৈনন্দিন জীবনের সঙ্গী। গাছ ছাড়া আমাদের ঘরবাড়ি, আসবাবপত্র ইত্যাদি তৈরি করা অসম্ভব। গাছ আমাদের বন্যা এবং প্রাকৃতিক দুর্যোগ থেকে রক্ষা করে। এটি মাটিকে শক্ত করে ধরে রাখে। আমরা যদি নির্বিচারে গাছ কাটি তবে পরিবেশগত ভারসাম্যহীনতা দেখা দেবে। তাই একটি সুন্দর, সুখী, আরও স্বাস্থ্যকর জীবন এবং শান্তিপূর্ণ পরিবেশের জন্য বৃক্ষরোপণ কর্মসূচি সম্প্রসারিত করা উচিত।","ans":["useful","natural","indiscriminately","plantation","healthier"]},{"no":19,"t":"Kindness","board":"DB 2025 / 2017","en":"[a] is a divine virtue. So we should not be unkind to people in distress and even to [b] animals. Some naughty boys enjoy beating the lower animals like dogs and cats. This is an [c] behaviour. Animals are dumb creatures. They are [d] beings. If we are kind to them, they will have no [e] in risking their lives for our protection.","bn":"দয়া একটি স্বর্গীয় গুণ। তাই বিপন্ন মানুষের প্রতি এবং এমনকি ছোট প্রাণীদের প্রতিও আমাদের নিষ্ঠুর হওয়া উচিত নয়। কিছু দুষ্ট ছেলে কুকুর এবং বিড়ালের মতো নিম্নতর প্রাণীদের মারধর করে আনন্দ পায়। এটি একটি অযৌক্তিক আচরণ। প্রাণীরা হলো বোবা জীব। তারা নিরীহ প্রাণী। আমরা যদি তাদের প্রতি দয়ালু হই, তবে তারা আমাদের সুরক্ষায় তাদের জীবন বাজি রাখতে কোনো দ্বিধা করবে না।","ans":["Kindness","lower","irrational","harmless","hesitation"]},{"no":26,"t":"Load-shedding","board":"CtgB 2019","en":"Load-shedding is not [a]. It is harmful to civilization. It makes our life [b] and boring. Because of a deficiency of electricity, load-shedding occurs. Our country is densely [c]. The storage of electricity is insufficient to provide electricity to all. As a result, load-shedding is seen [d]. But this problem must be removed immediately. So the [e] must be conscious of it. Only pragmatic steps can remove this serious problem from the country.","bn":"লোডশেডিং কোনো বাঞ্ছনীয় বিষয় নয়। এটি সভ্যতার জন্য ক্ষতিকর। এটি আমাদের জীবনকে অসহনীয় ও বিরক্তিকর করে তোলে। বিদ্যুতের ঘ const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const norm=s=>String(s||'').toLowerCase().replace(/[\s-]/g,'');
function passStart(){
  const c=tp==='all'?sh(PS.filter(x=>x.no!==lastP))[0]:PS.find(x=>x.no==tp);lastP=c.no;
  S.p=c;S.A=c.ans.map(w=>{const it=I.find(x=>x.p===c.no&&x.w===w),t=it.f.split(' + ');return{w,f:it.f,m:it.m,n:it.n,clue:t.some(isA)?t.filter(x=>!isA(x)).join(' + '):it.m}});
  S.vals=['','','','',''];S.res=null;S.showBn=false;S.focus=-1;S.bank=sh(c.ans.map(w=>w.toLowerCase()));passRender()}
function passRender(){
  const p=S.p,r=S.res,L='abcde';
  const txt=p.en.replace(/\[([a-e])\]/g,(m,l)=>{const i=L.indexOf(l);return `<span class="gw"><input class="gi${r?(r[i]?' ok':' no'):''}" data-i="${i}" value="${esc(S.vals[i])}"${r?' readonly':''} autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Gap ${l}"><small${/[^\x00-\x7f]/.test(S.A[i].clue)?' class="bn"':''}>(${l}) ${S.A[i].clue}</small></span>`});
  const sc=r?r.filter(Boolean).length:0;
  const res=r?`<div class="fb"><b>Score: ${sc}/5${sc===5?' · Perfect! +20 bonus XP':''}</b>${S.A.map((a,i)=>`<div style="margin-top:8px">(${L[i]}) ${r[i]?'✓':'✗'} <b>${a.w}</b> &nbsp;${fh(a.f)} <span class="chip">${kind(a.f)}</span><div class="ex bn">${a.n}</div></div>`).join('')}</div>`:'';
  stage.innerHTML=`<p class="cnt">Passage test<span class="tag">${String(p.no).padStart(2,'0')} ${p.t}${p.board?' · '+p.board:''}</span></p>
  <p class="how">Fill each gap with the right form of the clue word shown under it.</p>
  ${r?'':`<div class="seg"><button data-a="mm" data-v="0" class="${easy?'':'on'}">Exam: type</button><button data-a="mm" data-v="1" class="${easy?'on':''}">Easy: word bank</button></div>`}
  ${easy&&!r?`<div class="bank">${S.bank.map(w=>`<button data-a="chip" data-w="${w}">${w}</button>`).join('')}</div>`:''}
  <div class="ptext">${txt}</div>
  ${S.showBn||r?`<div class="bnbox bn"><small>বাংলা অনুবাদ</small>${p.bn}</div>`:''}${res}
  <div>${r?`<button class="next" data-a="retry">Try again</button>${tp==='all'?'<button class="next alt" data-a="pnext">Next passage</button>':''}`:`<button class="next" data-a="chk">Check answers</button><button class="next alt" data-a="bn">${S.showBn?'Hide':'Show'} Bangla</button>`}</div>`}
function passCheck(){
  if(S.res)return;S.res=S.A.map((a,i)=>norm(S.vals[i])===norm(a.w));
  const sc=S.res.filter(Boolean).length;addXP(sc*10+(sc===5?20:0));if(sc===5)PF++;hud();passRender()}
stage.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('gi'))S.vals[+e.target.dataset.i]=e.target.value});
stage.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('gi'))S.focus=+e.target.dataset.i});
stage.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='pick')pick(+b.dataset.i);else if(a==='next'){S.i++;show()}else if(a==='tag')tagPick(b.dataset.k);else if(a==='start')start();
  else if(a==='chk')passCheck();else if(a==='bn'){S.showBn=!S.showBn;passRender()}else if(a==='mm'){easy=b.dataset.v==='1';passRender()}
  else if(a==='chip'){let i=S.focus>=0&&!S.vals[S.focus]?S.focus:S.vals.findIndex(v=>!v);if(i<0)i=Math.max(S.focus,0);S.vals[i]=b.dataset.w;S.focus=-1;passRender()}
  else if(a==='retry'){S.vals=['','','','',''];S.res=null;S.showBn=false;S.focus=-1;S.bank=sh(S.bank);passRender()}else if(a==='pnext')start()});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;start()}));
$('#tp').addEventListener('change',e=>{tp=e.target.value;start()});
start();
</script></body></html>
